# Builds and publishes the FoodEx backend and frontend images to GHCR on every
# push to main, then lets Renovate open/update the image-version PR in
# kir-dev/k8s.
#
# Deployment itself is GitOps: Argo CD applies kir-dev/k8s. A merge here never
# touches the cluster directly.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-foodex
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The first run publishes v0.0.1 so kir-dev/k8s can reference a real
      # image before its own Renovate PRs start bumping the tag. Later runs use
      # the workflow run number, which Renovate can order as a semver.
      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          if [ -z "$(git tag -l 'v0.0.*')" ]; then
            echo "value=v0.0.1" >> "${GITHUB_OUTPUT}"
          else
            echo "value=v0.0.${GITHUB_RUN_NUMBER}" >> "${GITHUB_OUTPUT}"
          fi
          cat "${GITHUB_OUTPUT}"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/foodex-backend
            ghcr.io/${{ github.repository_owner }}/foodex-frontend
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest
            type=sha,format=long

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Renovate needs a Git tag to show a GitHub diff link.
      - name: Create Git tag
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          if git rev-parse "${VERSION}" >/dev/null 2>&1; then
            echo "${VERSION} already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${VERSION}"
            git push origin "${VERSION}"
          fi

  update-k8s:
    name: Open k8s image update PR
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # The TypeScript Renovate config lives in kir-dev/k8s (.dev/renovate.ts).
      - name: Checkout k8s
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kir-dev/k8s
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2

      # bunx runs Renovate with Node; renovate@44 requires Node ^24.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: bun install --frozen-lockfile

      # Renders foodex/renovate.ts and opens/updates a PR on kir-dev/k8s.
      - run: bun run renovate foodex
        env:
          RENOVATE_TOKEN: ${{ secrets.KIR_DEV_BOT_PAT }}

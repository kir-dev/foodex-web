name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Run tests
        working-directory: apps/backend
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

  test-postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: foodex_test
          POSTGRES_USER: foodex
          POSTGRES_PASSWORD: foodex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/foodex_test
      SPRING_DATASOURCE_USERNAME: foodex
      SPRING_DATASOURCE_PASSWORD: foodex

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Run tests against Postgres
        working-directory: apps/backend
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

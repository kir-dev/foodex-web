name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "apps/frontend/**"
      - ".github/workflows/deploy-frontend.yml"
      - ".github/workflows/deploy-image.yml"
  workflow_dispatch:

concurrency:
  group: production-foodex
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy-image.yml
    with:
      component: frontend
      context: apps/frontend
      image: foodex-frontend
    secrets:
      KIR_DEV_BOT_PAT: ${{ secrets.KIR_DEV_BOT_PAT }}

# Test profile defaults — avoid live AuthSCH OIDC discovery
spring.datasource.url=jdbc:h2:mem:foodex-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false

foodex.frontend-url=http://localhost:3000

spring.security.oauth2.client.registration.authsch.provider=authsch
spring.security.oauth2.client.registration.authsch.client-id=test-client
spring.security.oauth2.client.registration.authsch.client-secret=test-secret
spring.security.oauth2.client.registration.authsch.scope=openid,profile,email
spring.security.oauth2.client.registration.authsch.redirect-uri=http://localhost:8080/login/oauth2/code/authsch
spring.security.oauth2.client.provider.authsch.authorization-uri=http://localhost/oauth/authorize
spring.security.oauth2.client.provider.authsch.token-uri=http://localhost/oauth/token
spring.security.oauth2.client.provider.authsch.user-info-uri=http://localhost/oauth/userinfo
spring.security.oauth2.client.provider.authsch.jwk-set-uri=http://localhost/oauth/jwks
spring.security.oauth2.client.provider.authsch.user-name-attribute=sub

# Postgres-backed test profile. Activate with SPRING_PROFILES_ACTIVE=postgres
# and point SPRING_DATASOURCE_URL at a running Postgres instance.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/foodex_test}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:foodex}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:foodex}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop

### SPECIFY AUTHSCH
spring.security.oauth2.client.registration.authsch.client-id=${FOODEX_AUTHSCH_ID}
spring.security.oauth2.client.registration.authsch.client-secret=${FOODEX_AUTHSCH_KEY}
spring.security.oauth2.client.registration.authsch.redirect-uri=${FOODEX_BASEURL:http://localhost:8080/}login/oauth2/code/authsch
spring.datasource.url=${FOODEX_DATA_SOURCE}
foodex.frontend-url=${FOODEX_FRONTEND_URL}

# Short INFO/WARN/ERROR lines only. SQL debug freezes k9s and blocks requests on stdout.
# Raise temporarily with: LOGGING_LEVEL_HU_KIRDEV_FOODEX=DEBUG
logging.level.root=INFO
logging.level.hu.kirdev.foodex=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
